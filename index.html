<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monólogo</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vw;
    box-sizing: border-box;
  }
  #texto {
    max-width: 900px;
    text-align: center;
    color: #f2f2f2;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(20px, 3vw, 36px);
    line-height: 1.6;
    letter-spacing: .02em;
  }
  #texto span {
    opacity: 0;
    filter: blur(4px);
    transition: opacity 1.4s ease, filter 1.4s ease;
  }
  #texto span.on {
    opacity: 1;
    filter: blur(0);
  }
</style>
</head>
<body>

<div id="texto"></div>

<script>
  const MONOLOGO = `I've||| seen| things you people wouldn't believe. Attack ships on fire off the shoulder of Orion. I watched C-beams| glitter in the dark near the Tannhäuser Gate. All those moments|| will be lost|| in time|| like|| tears|| in the rain. `;

  // ===== AJUSTES =====
  const VELOCIDADE   = 350;   // tempo entre cada palavra (ms) — maior = mais devagar
  const PAUSA_PONTO  = 1200;  // pausa extra depois de . ! ? …
  const PAUSA_VIRGULA = 400;  // pausa extra depois de , ; :
  const MARCA_PAUSA  = "|";   // caractere de pausa invisível (não aparece na tela)
  const PAUSA_MARCA  = 600;   // duração de cada marca — use || ou ||| para pausas maiores
  const ATRASO_INICIO = 1500; // espera antes de começar (ms)
  const REPETIR      = false; // true = recomeça sozinho no final
  const PAUSA_FINAL  = 6000;  // tempo na tela antes de recomeçar (se REPETIR = true)
  // ===================

  const box = document.getElementById("texto");
  const esperar = ms => new Promise(r => setTimeout(r, ms));

  function montar() {
    box.innerHTML = "";
    const palavras = []; // { s: <span>, extra: ms }
    const marcas = new RegExp(MARCA_PAUSA.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g");
    let inicial = 0; // marcas antes da primeira palavra
    MONOLOGO.trim().split("\n").forEach((linha, i, todas) => {
      linha.trim().split(/\s+/).filter(Boolean).forEach(p => {
        const n = (p.match(marcas) || []).length;
        const limpa = p.replace(marcas, "");
        if (limpa === "") {
          if (palavras.length) palavras[palavras.length - 1].extra += n * PAUSA_MARCA;
          else inicial += n * PAUSA_MARCA;
          return;
        }
        const s = document.createElement("span");
        s.textContent = limpa;
        box.appendChild(s);
        box.appendChild(document.createTextNode(" "));
        palavras.push({ s, extra: n * PAUSA_MARCA });
      });
      if (i < todas.length - 1) box.appendChild(document.createElement("br"));
    });
    palavras.inicial = inicial;
    return palavras;
  }

  async function tocar() {
    do {
      const palavras = montar();
      await esperar(ATRASO_INICIO + palavras.inicial);
      for (const { s, extra } of palavras) {
        s.classList.add("on");
        let t = VELOCIDADE + extra;
        if (/[.!?…]$/.test(s.textContent)) t += PAUSA_PONTO;
        else if (/[,;:]$/.test(s.textContent)) t += PAUSA_VIRGULA;
        await esperar(t);
      }
      if (REPETIR) {
        await esperar(PAUSA_FINAL);
        palavras.forEach(({ s }) => s.classList.remove("on"));
        await esperar(1600);
      }
    } while (REPETIR);
  }

  tocar();
</script>
</body>
</html>
