<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlas87 — Teste GitHub Pages</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: #f8fafc;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 520px;
      width: 100%;
    }
    .ok {
      display: inline-block;
      width: 64px; height: 64px;
      line-height: 64px;
      border-radius: 50%;
      background: #22c55e;
      font-size: 32px;
      margin-bottom: 24px;
    }
    h1 { font-size: 1.9rem; margin-bottom: 12px; }
    p { color: #cbd5e1; line-height: 1.6; }
    .info {
      margin-top: 28px;
      font-size: 0.9rem;
      color: #94a3b8;
    }
    code {
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 8px;
      border-radius: 6px;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="ok">✓</div>
    <h1>Funcionou!</h1>
    <p>Esta página está sendo servida pelo GitHub Pages a partir do repositório <strong>Athlas87</strong>.</p>
    <div class="info">
      <p>Endereço atual: <code id="host"></code></p>
      <p>Protocolo: <code id="proto"></code></p>
    </div>
  </main>
  <script>
    document.getElementById("host").textContent = location.host;
    document.getElementById("proto").textContent = location.protocol.replace(":", "").toUpperCase();
  </script>
</body>
</html>
